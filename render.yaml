services:
  - type: web
    name: solis-os-chatbot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ID
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
